    id: need
    attributes:
      label: What are you trying to build?
      description: The problem first. It helps us find the right shape for the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      placeholder: A `size` prop on Avatar, or a new Stepper component.

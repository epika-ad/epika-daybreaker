name: Bug report
description: Something in a component doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: e.g. Select
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: Opening the Select inside a Dialog closes the Dialog. I expected only the Select to open.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows it
      description: The fewer lines the better. A link to a CodeSandbox or StackBlitz works too.
      render: tsx
  - type: input
    id: versions
    attributes:
      label: Versions
      description: daybreaker, React, and the browser.
      placeholder: daybreaker 1.0.0, React 19.1, Chrome 140
    validations:
      required: true
